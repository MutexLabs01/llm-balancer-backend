server:
  host: "0.0.0.0"
  port: 8081

gateway:
  host: "0.0.0.0"
  port: 8081
  load_balancing_strategy: "adaptive"
  node_discovery_interval: "60s"
  circuit_breaker_enabled: true
  circuit_breaker_threshold: 5

logging:
  level: "info"
  format: "text"
  output: "stdout"

metrics:
  enabled: true
  port: 9090
  path: "/metrics"